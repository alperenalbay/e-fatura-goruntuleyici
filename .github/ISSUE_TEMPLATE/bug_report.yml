name: Hata bildirimi
description: Bir hata veya beklenmeyen davranış bildirin
title: "[Hata] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Gizlilik uyarısı:** Gerçek fatura XML'i, VKN/TCKN, isim, adres veya tutar
        paylaşmayın. Lütfen kurgusal örnek kullanın veya hassas alanları kapatın.

  - type: input
    id: surum
    attributes:
      label: Uygulama sürümü
      description: Hakkında penceresinde veya dosya adında yazar (ör. 1.0.0).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows sürümü
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: dropdown
    id: belge
    attributes:
      label: Belge türü
      options:
        - e-Fatura
        - e-Arşiv
        - e-İrsaliye
        - Diğer / emin değilim
    validations:
      required: true

  - type: textarea
    id: adimlar
    attributes:
      label: Yeniden üretme adımları
      description: Sorunu tetikleyen adımlar.
      placeholder: |
        1. Uygulamayı açtım
        2. ... dosyasını açtım
        3. Sorgula düğmesine bastım
    validations:
      required: true

  - type: textarea
    id: beklenen
    attributes:
      label: Beklenen ve gerçekleşen davranış
    validations:
      required: true

  - type: textarea
    id: ek
    attributes:
      label: Ek bilgi
      description: Hata mesajı, ekran görüntüsü (hassas veri olmadan) veya konsol çıktısı.
    validations:
      required: false

  - type: checkboxes
    id: gizlilik
    attributes:
      label: Gizlilik onayı
      options:
        - label: Paylaştığım içerikte gerçek kişi/kurum verisi yok.
          required: true
